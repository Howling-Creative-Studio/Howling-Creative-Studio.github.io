<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Howling Creative Studio</title>
<meta name="description" content="Howling Creative Studio — a quiet reminder, for the people you think of.">
<style>
  :root{
    --bg:#faf7f2; --ink:#2e2a26; --sub:#8a8178; --accent:#c98a6b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#211e1b; --ink:#f3efe9; --sub:#a89f94; --accent:#e0a380; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Roboto,sans-serif;
    padding:24px;
  }
  main{ max-width:480px; text-align:center; }
  h1{ font-size:1.5rem; font-weight:700; letter-spacing:-0.01em; margin:0 0 8px; }
  p.tagline{ color:var(--sub); font-size:1rem; line-height:1.6; margin:0 0 32px; }
  .apps{ display:flex; flex-direction:column; gap:12px; }
  a.app-link{
    display:block; padding:14px 20px; border-radius:12px;
    background:transparent; border:1px solid var(--sub);
    color:var(--ink); text-decoration:none; font-size:0.95rem;
    transition:border-color .15s ease;
  }
  a.app-link:hover{ border-color:var(--accent); }
  a.app-link b{ color:var(--accent); }
  footer{ margin-top:40px; color:var(--sub); font-size:0.8rem; }
</style>
</head>
<body>
<main>
  <h1>Howling Creative Studio</h1>
  <p class="tagline">하루의 틈에, 작은 안부.<br>In life's small gaps, a small hello.</p>
  <div class="apps">
    <a class="app-link" href="https://play.google.com/store/apps/details?id=com.howlingcreativestudio.hellotoday">
      <b>Hello, Today</b> — 가끔 생각나는 사람에게 전하는 작은 안부
    </a>
  </div>
  <footer>&copy; 2026 Howling Creative Studio</footer>
</main>
</body>
</html>
